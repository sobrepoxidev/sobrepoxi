# sobrepoxi.com — tienda Next.js self-hosted (salió de Vercel el 2026-10-19).
# PM2 `sobrepoxi` (next start) en 127.0.0.1:3150; deploy: scripts/deploy/vps.sh del repo sobrepoxi.
# Certificado: certbot webroot (/var/www/certbot), hook copy-to-omnileads.sh -> /etc/nginx/certs/sobrepoxi_*.pem
# sobrepoxi-acme.31-97-210-100.sslip.io: destino del redirect ACME que Vercel servía durante el corte.
server {
    listen 80;
    server_name sobrepoxi.com www.sobrepoxi.com sobrepoxi-acme.31-97-210-100.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://sobrepoxi.com$request_uri; }
}

server {
    # Bind a la IP como el resto de bloques 443 de este nginx.
    listen 31.97.210.100:443 ssl;
    http2 on;
    server_name sobrepoxi.com;

    ssl_certificate     /etc/nginx/certs/sobrepoxi_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/sobrepoxi_privkey.pem;

    client_max_body_size 25m;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:3150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    # www -> apex here: the Next middleware would build the redirect with its internal port (:3150).
    listen 31.97.210.100:443 ssl;
    http2 on;
    server_name www.sobrepoxi.com;
    ssl_certificate     /etc/nginx/certs/sobrepoxi_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/sobrepoxi_privkey.pem;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://sobrepoxi.com$request_uri; }
}
